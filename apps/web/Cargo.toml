[package]
name = "itu_calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }

# Server dependencies
serde = { version = "1", features = ["derive"] }
csv-async = { optional = true, version = "1.3", features = ["tokio"] }
futures-util = { optional = true, version = "0.3" }
rusqlite = { optional = true, version = "0.40.2" }
reqwest = { optional = true, version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { optional = true, version = "0.7", features = ["io"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:csv-async", "dep:futures-util", "dep:rusqlite", "dep:reqwest", "dep:tokio-util"]
